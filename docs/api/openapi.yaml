openapi: 3.1.0
info:
  title: Matrix Attual Core API
  version: 0.1.0
  description: API v1 para eventos, identidade e recomendacoes da Matrix Attual.
servers:
  - url: https://api.example.invalid
    description: Placeholder ate o endpoint oficial ser provisionado
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
  /v1/events:
    post:
      operationId: ingestEvent
      security:
        - publicClient: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '200':
          description: Accepted or idempotent duplicate
          content:
            application/json:
              schema:
                type: object
                required: [accepted, event_id, correlation_id]
                properties:
                  accepted: { type: boolean }
                  duplicate: { type: boolean, default: false }
                  event_id: { type: string, format: uuid }
                  correlation_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /v1/events/batch:
    post:
      operationId: ingestEventBatch
      security:
        - publicClient: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/EventEnvelope' }
      responses:
        '200': { description: Batch processed }
  /v1/recommendations:
    get:
      operationId: getRecommendations
      security:
        - personSession: []
      parameters:
        - in: query
          name: project_key
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: Recommendation set
  /v1/identity/resolve:
    post:
      operationId: resolveIdentity
      security:
        - backendClient: []
      responses:
        '200': { description: Identity resolution result }
  /v1/people/{person_id}/summary:
    get:
      operationId: personSummary
      security:
        - backendClient: []
      parameters:
        - in: path
          name: person_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Person summary }
components:
  securitySchemes:
    publicClient:
      type: apiKey
      in: header
      name: X-Matrix-Client
    personSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
    backendClient:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [event_id, event_type, occurred_at, project_key, idempotency_key]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string, minLength: 3, maxLength: 128 }
        occurred_at: { type: string, format: date-time }
        project_key: { type: string, minLength: 2, maxLength: 100 }
        anonymous_id: { type: [string, 'null'] }
        person_token: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
        object:
          type: [object, 'null']
          properties:
            type: { type: string }
            id: { type: string }
        properties: { type: object, default: {} }
        context: { type: object, default: {} }
        idempotency_key: { type: string, minLength: 8, maxLength: 200 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code: { type: string }
            message: { type: string }
            correlation_id: { type: string, format: uuid }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
