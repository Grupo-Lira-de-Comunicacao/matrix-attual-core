name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts-and-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obvious secrets
        run: |
          set -e
          if git grep -nE '(SUPABASE_SERVICE_ROLE_KEY\s*=|SUPABASE_ACCESS_TOKEN\s*=|sb_secret_|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!.github/workflows/validate.yml'; then
            echo 'Potential secret committed.'
            exit 1
          fi
      - name: Verify migration sequence
        run: |
          set -e
          for n in $(seq -w 1 24); do
            test $(find supabase/migrations -maxdepth 1 -type f -name "${n}_*.sql" | wc -l) -eq 1
          done
          count=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$count" -eq 24
      - name: Verify retention safety contract
        run: |
          set -e
          file=supabase/migrations/016_matrix_retention_policy.sql
          grep -q 'matrix_run_retention' "$file"
          grep -q 'matrix-retention-daily-v1' "$file"
          grep -q "revoke all on function public.matrix_run_retention" "$file"
      - name: Verify M2 shadow intelligence safety contract
        run: |
          set -e
          file=supabase/migrations/017_matrix_m2_shadow_intelligence.sql
          grep -q 'matrix_run_m2_shadow' "$file"
          grep -q "'marketing_enabled', false" "$file"
          grep -q "revoke all on function public.matrix_run_m2_shadow" "$file"
      - name: Verify M3 controlled activation safety contract
        run: |
          set -e
          file=supabase/migrations/020_matrix_m3_controlled_activation.sql
          grep -q 'matrix_m3_action_outbox' "$file"
          grep -q 'matrix_run_m3_control' "$file"
          grep -q "revoke all on function public.matrix_run_m3_control" "$file"
          grep -q '/v1/recommendations/query' src/app.ts
      - name: Verify M4 identity and downstream safety contract
        run: |
          set -e
          file=supabase/migrations/021_matrix_m4_identity_bridge.sql
          guards=supabase/migrations/022_matrix_m4_api_grants_and_guards.sql
          grep -q 'matrix_identity_bridge_tokens' "$file"
          grep -q 'matrix_person_sessions' "$file"
          grep -q 'matrix_m4_context_promotions' "$file"
          grep -q 'matrix_current_person_consent' "$file"
          grep -q 'matrix_run_m4_control' "$file"
          grep -q "'marketing_enabled', false" "$file"
          grep -q "'n8n_external_actions_enabled', false" "$file"
          grep -q 'M4_CONTROL_EXECUTE_EXPOSED' "$guards"
          grep -q '/v1/identity/link' src/app.ts
          grep -q '/v1/identity/unlink' src/app.ts
      - name: Verify M5 corporate catalog contract
        run: |
          set -e
          schema=supabase/migrations/023_matrix_corporate_catalog.sql
          seed=supabase/migrations/024_matrix_corporate_catalog_seed.sql
          grep -q 'matrix_source_domains' "$schema"
          grep -q 'parent_entity_id' "$schema"
          grep -q 'source_domain_id' "$schema"
          grep -q 'matrix_entities_tenant_slug_uidx' "$schema"
          grep -q 'revoke all on public.matrix_source_domains from public, anon, authenticated' "$schema"
          grep -q "'grupo-lira-de-comunicacao','GL-001'" "$seed"
          grep -q "'tv-attual','BR-001'" "$seed"
          grep -q "'att-comunica','BR-005'" "$seed"
          grep -q "'lava-laundry-vale','BR-010'" "$seed"
          test -f docs/implementation/M5_CORPORATE_CATALOG_v1.md
      - name: Verify required contracts
        run: |
          test -f docs/events/EVENT_CATALOG_v1.md
          test -f docs/contracts/ATTUALPLAY_DATA_CONTRACT_v1.md
          test -f docs/api/openapi.yaml
          test -f docs/implementation/M4_IDENTITY_BRIDGE_v1.md
          test -f docs/implementation/M5_CORPORATE_CATALOG_v1.md
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and unit tests
        run: npm run check
      - name: Build VPS runtime
        run: npm run build:server
      - name: Build Docker image
        run: docker build -t matrix-attual-api:ci .
